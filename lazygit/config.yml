git:
  diffRenderers:
    - colorArg: always
      # pager: delta --dark --paging=never
      type: rawGit
customCommands:
  - key: '<a-c>'
    command: 'git-ai-commit'
    context: 'files'
    output: 'terminal'
    description: 'Generar y revisar commit con el CLI configurado'
  - key: '<a-s-c>'
    command: 'git-ai-commit-config'
    context: 'files'
    output: 'terminal'
    description: 'Configurar CLI y modelo para commits con IA'
