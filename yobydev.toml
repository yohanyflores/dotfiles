# Candidato para subir al repositorio público de dotfiles.
# El archivo debe vivir en la raíz del checkout y llamarse yobydev.toml.
# No se ha aplicado todavía.

[tools]
neovim = "0.12.5"
micro = "2.0.15"
zellij = "0.45.1"
lazygit = "0.64.1"
starship = "1.26.0"
zoxide = "0.10.0"
bat = "0.26.1"
eza = "0.23.5"
delta = "0.19.2"
ripgrep = "15.2.0"
fd = "10.5.0"
fzf = "0.74.3"

[tool_alias]
yazi = "github:sxyazi/yazi"

[tools.yazi]
version = "26.9.1"
asset_pattern = "yazi-x86_64-unknown-linux-musl.zip"

[dotfiles]
"~/.config/nvim" = { source = "nvim", mode = "symlink" }
"~/.config/yazi" = { source = "yazi", mode = "symlink" }
"~/.config/zellij" = { source = "zellij", mode = "symlink" }
"~/.config/micro" = { source = "micro", mode = "symlink" }
"~/.config/lazygit" = { source = "lazygit", mode = "symlink" }
"~/.config/fish" = { source = "fish", mode = "symlink" }
"~/.config/starship.toml" = { source = "starship/starship.toml", mode = "symlink" }
